name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PokemonTcgMarketplace.sln

      - name: Dependency vulnerability report
        run: dotnet list PokemonTcgMarketplace.sln package --vulnerable --include-transitive

      - name: Build
        run: dotnet build PokemonTcgMarketplace.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PokemonTcgMarketplace.sln --no-build --configuration Release --verbosity normal

      - name: Check EF Core migrations are up to date
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef migrations has-pending-model-changes --project backend

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          CI: true

  worker:
    name: Edge Worker (Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
