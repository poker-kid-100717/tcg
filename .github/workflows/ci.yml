name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PokemonTcgMarketplace.sln

      - name: Build
        run: dotnet build PokemonTcgMarketplace.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PokemonTcgMarketplace.sln --no-build --configuration Release --verbosity normal

      - name: Check EF Core migrations are up to date
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef migrations has-pending-model-changes --project backend

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true

  worker:
    name: Edge Worker (Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    name: Deploy (Cloudflare Workers + Containers)
    needs: [backend, frontend, worker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      # Deploys start once the Cloudflare/app secrets exist; until then this
      # job skips with a notice instead of failing the run.
      - name: Check deploy secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          for value in "$CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_ACCOUNT_ID" "$DATABASE_URL" "$JWT_KEY"; do
            if [ -z "$value" ]; then
              echo "::notice::Deploy secrets are not configured yet; skipping deploy."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Setup Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build frontend
        if: steps.secrets.outputs.ready == 'true'
        run: npm run build:frontend
        env:
          CI: true

      # Builds backend/Dockerfile, pushes it to Cloudflare's registry, and
      # deploys the Worker, static assets and container together.
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            DATABASE_URL
            JWT_KEY
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_KEY: ${{ secrets.JWT_KEY }}

      # The first request after a deploy cold-starts the container, so allow
      # a generous retry window before calling it a failure.
      - name: Smoke test
        if: steps.secrets.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$DEPLOYMENT_URL/health" | grep -q Healthy
          curl --fail --silent --show-error "$DEPLOYMENT_URL/sets" | grep -q '<div id="root">'
          # Reaches the API through the Worker and hits auth: 401 means routing works.
          code="$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$DEPLOYMENT_URL/api/orders")"
          test "$code" = 401 || { echo "expected 401 from unauthenticated /api/orders, got $code"; exit 1; }
